# swiftmr-log-jump.netlify.app — 정적 사이트, 빌드 없음
[build]
  publish = "."

# Notion 등에 iframe 임베드를 쓰려면 X-Frame-Options 를 넣지 않는다.
# 임베드가 필요 없으면 아래 두 줄의 주석을 풀어 클릭재킹을 막는다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    # X-Frame-Options = "SAMEORIGIN"
    # Content-Security-Policy = "frame-ancestors 'self'"

[[redirects]]
  from = "/manual"
  to = "/playbook.html"
  status = 200

[[redirects]]
  from = "/playbook"
  to = "/playbook.html"
  status = 200
